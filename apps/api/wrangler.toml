name = "ai-vlog-api"
main = "src/index.ts"
compatibility_date = "2026-04-22"
workers_dev = true

[[routes]]
pattern = "api-vlog.aiid.qzz.io"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "ai-vlog"
database_id = "0598e3c1-eaf8-46ee-b06f-f1e3bdae724c"

[[kv_namespaces]]
binding = "CACHE"
id = "04beb9460b9d41f885140af639b07ef5"

[[kv_namespaces]]
binding = "SESSIONS"
id = "fd9bf0998eda4cbd8fc0bae557af4b3c"

[vars]
ADMIN_USERNAME = "admin"
ENVIRONMENT = "production"
SITE_URL = "https://vlog.aiid.qzz.io"
