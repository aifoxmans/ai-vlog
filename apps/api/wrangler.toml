name = "ai-vlog-api"
main = "src/index.ts"
compatibility_date = "2026-04-22"

[[d1_databases]]
binding = "DB"
database_name = "ai-vlog"
database_id = "replace-with-real-database-id"

[[kv_namespaces]]
binding = "CACHE"
id = "replace-with-real-cache-kv-id"

[[kv_namespaces]]
binding = "SESSIONS"
id = "replace-with-real-session-kv-id"

[vars]
ADMIN_USERNAME = "admin"
ADMIN_PASSWORD = "admin123"
