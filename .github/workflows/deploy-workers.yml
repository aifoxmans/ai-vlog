name: Deploy Cloudflare Workers

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-vlog-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
      PUBLIC_ADMIN_APP_URL: ${{ vars.PUBLIC_ADMIN_APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check deployment configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$ADMIN_PASSWORD"
          test "$PUBLIC_API_BASE_URL" = "https://api-vlog.aiid.qzz.io"
          test "$PUBLIC_ADMIN_APP_URL" = "https://admin-vlog.aiid.qzz.io/login"
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Apply D1 migrations
        working-directory: apps/api
        run: npx wrangler d1 migrations apply ai-vlog --remote
      - name: Deploy API Worker
        working-directory: apps/api
        run: npx wrangler deploy
      - name: Configure admin password
        working-directory: apps/api
        run: printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD
      - name: Deploy admin Worker
        working-directory: apps/admin
        run: npx wrangler deploy
      - name: Deploy public Worker
        working-directory: apps/web
        run: npx wrangler deploy
      - name: Verify public endpoints
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors "$PUBLIC_API_BASE_URL/api/public/navigation" > /dev/null
          npm run smoke:api -- "$PUBLIC_API_BASE_URL"
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors "https://vlog.aiid.qzz.io/" > /dev/null
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors "https://admin-vlog.aiid.qzz.io/login" > /dev/null
